apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-baseline
  labels:
    app: vllm-baseline
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vllm-baseline
  template:
    metadata:
      labels:
        app: vllm-baseline
    spec:
      nodeSelector:
        node-role.kubernetes.io/gpu-worker: ""
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: "vllm/vllm-openai:latest"
          args:
            - "--model"
            - "Qwen/Qwen3-8B"
            - "--served-model-name"
            - "Qwen/Qwen3-8B"
            - "--max-model-len"
            - "4096"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: HOME
              value: /tmp
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm
            - name: HF_HOME
              value: /tmp/hf
          ports:
            - containerPort: 8000
              name: http
          resources:
            limits:
              nvidia.com/gpu: 1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-baseline
  labels:
    app: vllm-baseline
spec:
  selector:
    app: vllm-baseline
  ports:
    - port: 80
      targetPort: 8000
      name: http

  sessionAffinity: None